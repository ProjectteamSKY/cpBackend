[order]

create = """
INSERT INTO orders (
    id, user_id, cart_id, address_id, status, total_amount, created_at, updated_at
) VALUES (
    :id, :user_id, :cart_id, :address_id, :status, :total_amount, :created_at, :updated_at
);
"""

get_all = """
SELECT * FROM orders
WHERE user_id = :user_id
ORDER BY created_at DESC;
"""

get_by_id = """
SELECT * FROM orders
WHERE id = :id;
"""

get_all_tracking = """
SELECT 
    o.*, 
    u.full_name AS username,
    u.email,
    u.contact AS user_phone,
    a.address AS address_line,
    a.city,
    a.state,
    a.country,
    a.postal_code,
    a.phone AS address_phone
FROM orders o
JOIN users u ON u.id = o.user_id
LEFT JOIN user_addresses a ON a.id = o.address_id
ORDER BY o.created_at DESC;
"""

update = """
UPDATE orders
SET {set_clause}
WHERE id = :id;
"""

delete = """
DELETE FROM orders
WHERE id = :id;
"""