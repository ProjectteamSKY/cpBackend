[order]

create = """
INSERT INTO orders (
    id, user_id, order_number, cart_id, address_id, status,
    total_amount, created_at, updated_at
) VALUES (
    :id, :user_id, :order_number, :cart_id, :address_id, :status,
    :total_amount, :created_at, :updated_at
);
"""

get_all = """
SELECT *
FROM orders
WHERE user_id = :user_id
ORDER BY created_at DESC;
"""

get_by_id = """
SELECT *
FROM orders
WHERE id = :id;
"""

get_all_tracking = """
SELECT 
    o.*, 
    u.full_name AS username,
    u.email,
    u.contact AS user_phone,

    a.address AS address_line,
    a.city,
    a.state,
    a.country,
    a.postal_code,
    a.phone AS address_phone,

    s.awb_code,
    s.courier_name,
    s.freight_charges,
    s.tracking_url,
    s.label_url,
    s.current_status,
    s.pickup_status,
    s.delivered_at

FROM orders o
JOIN users u ON u.id = o.user_id
LEFT JOIN user_addresses a ON a.id = o.address_id
LEFT JOIN shipments s ON s.order_id = o.id

ORDER BY o.created_at DESC;
"""

update = """
UPDATE orders
SET {set_clause}
WHERE id = :id;
"""

delete = """
DELETE FROM orders
WHERE id = :id;
"""

get_status = """
SELECT status
FROM orders
WHERE id = :id;
"""

update_status = """
UPDATE orders
SET status = :status,
    updated_at = NOW()
WHERE id = :id;
"""

get_total_orders = """
SELECT COUNT(*) AS total_orders
FROM orders;
"""

get_total_orders_by_user = """
SELECT COUNT(*) AS total_orders
FROM orders
WHERE user_id = :user_id;
"""

get_total_orders_by_status = """
SELECT status, COUNT(*) AS total
FROM orders
GROUP BY status;
"""

get_orders_summary = """
SELECT
    COUNT(*) AS total_orders,
    SUM(CASE WHEN status = 'pending' THEN 1 ELSE 0 END) AS pending_orders,
    SUM(CASE WHEN status = 'process' THEN 1 ELSE 0 END) AS process_orders,
    SUM(CASE WHEN status = 'printing' THEN 1 ELSE 0 END) AS printing_orders,
    SUM(CASE WHEN status = 'packed' THEN 1 ELSE 0 END) AS packed_orders,
    SUM(CASE WHEN status = 'shipment' THEN 1 ELSE 0 END) AS shipment_orders,
    SUM(CASE WHEN status = 'delivery' THEN 1 ELSE 0 END) AS delivery_orders
FROM orders;
"""


get_sales_summary = """
SELECT
    COUNT(*) AS total_orders,
    COALESCE(SUM(total_amount), 0) AS total_sales,
    COALESCE(AVG(total_amount), 0) AS average_order_value,
    COALESCE(SUM(delivery_charge), 0) AS total_delivery_charge
FROM orders
WHERE status != 'cancelled';
"""

get_monthly_revenue = """
SELECT
    DATE_FORMAT(created_at, '%b') AS month,
    SUM(total_amount) AS revenue
FROM orders
GROUP BY MONTH(created_at), DATE_FORMAT(created_at, '%b')
ORDER BY MONTH(created_at);
"""

get_top_products = """
SELECT
    p.name,
    COUNT(DISTINCT oi.order_id) AS total_orders,
    SUM(oi.quantity) AS total_units_sold,
    SUM(oi.total_price) AS revenue,
    AVG(oi.unit_price) AS avg_selling_price
FROM order_items oi
JOIN products p ON p.id = oi.product_id
GROUP BY p.id, p.name
ORDER BY total_units_sold DESC
LIMIT 5;
"""

get_recent_orders = """
SELECT
    o.order_number,
    u.full_name AS customer,
    o.total_amount AS amount,
    o.status
FROM orders o
JOIN users u ON u.id = o.user_id
ORDER BY o.created_at DESC
LIMIT 5;
"""

get_last_order_number = """
SELECT order_number
FROM orders
ORDER BY created_at DESC
LIMIT 1;
"""

[order_item]

create = """
INSERT INTO order_items (
    order_id, cart_item_id, product_id, variant_id,
    quantity, price, total, created_at, updated_at
)
VALUES (
    :order_id, :cart_item_id, :product_id, :variant_id,
    :quantity, :price, :total, :created_at, :updated_at
);
"""

get_all_by_order = """
SELECT
    oi.id,
    oi.order_id,
    oi.product_id,
    oi.variant_id,
    oi.quantity,
    oi.unit_price,
    oi.total_price,
    oi.selected_attributes,
    oi.status,
    oi.created_at,

    -- PRODUCT DETAILS
    p.name AS product_name,
    p.description AS product_description,
    p.images AS product_images

FROM order_items oi

LEFT JOIN products p
    ON p.id = oi.product_id

WHERE oi.order_id = :order_id

ORDER BY oi.created_at DESC;
"""



[cart]

lock_items = """
SELECT *
FROM cart_items
WHERE cart_id = :cart_id
AND id IN :cart_item_ids
FOR UPDATE;
"""

get_files = """
SELECT *
FROM cart_item_files
WHERE cart_item_id = :cart_item_id;
"""

mark_purchased = """
UPDATE cart_items
SET status = 'purchased',
    updated_at = :updated_at
WHERE id IN :cart_item_ids;
"""

get_cart_total = """
SELECT COALESCE(SUM(total_price), 0) AS total
FROM cart_items
WHERE cart_id = :cart_id
AND status = 'active';
"""

update_cart_total = """
UPDATE carts
SET total_amount = :total,
    updated_at = :updated_at
WHERE id = :cart_id;
"""

