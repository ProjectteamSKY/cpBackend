[paper_type]

create = """
INSERT INTO paper_types (
    id,
    name,
    description,
    is_active,
    created_at,
    updated_at
) VALUES (
    :id,
    :name,
    :description,
    :is_active,
    :created_at,
    :updated_at
);
"""


get_all = """
SELECT *
FROM paper_types
WHERE is_active = TRUE
ORDER BY created_at DESC;
"""


get_by_id = """
SELECT *
FROM paper_types
WHERE id = :id;
"""


update = """
UPDATE paper_types
SET {set_clause}, updated_at = NOW()
WHERE id = :id;
"""


delete = """
UPDATE paper_types
SET is_active = FALSE, updated_at = NOW()
WHERE id = :id;
"""


activate = """
UPDATE paper_types
SET is_active = TRUE, updated_at = NOW()
WHERE id = :id;
"""


deactivate = """
UPDATE paper_types
SET is_active = FALSE, updated_at = NOW()
WHERE id = :id;
"""