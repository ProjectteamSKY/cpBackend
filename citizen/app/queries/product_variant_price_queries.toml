[product_variant_price]

create = """
INSERT INTO product_variant_prices (
    id, variant_id, discount_id, min_qty, price, is_active, created_at, updated_at
) VALUES (
    :id, :variant_id, :discount_id, :min_qty, :price, :is_active, :created_at, :updated_at
);
"""

get_all = """
SELECT 
    pvp.*, 
    pd.description AS discount_name,
    p.name AS product_name
FROM product_variant_prices pvp

LEFT JOIN product_variants pv
    ON pvp.variant_id = pv.id
    AND pv.is_deleted = FALSE

LEFT JOIN products p
    ON pv.product_id = p.id
    AND p.is_deleted = FALSE

LEFT JOIN product_discounts pd 
    ON pvp.discount_id = pd.id
    AND pd.is_deleted = FALSE

WHERE pvp.is_deleted = FALSE
ORDER BY pvp.created_at DESC;
"""

get_by_id = """
SELECT * FROM product_variant_prices
WHERE id = :id;
"""

get_by_variant = """
SELECT * FROM product_variant_prices
WHERE variant_id = :variant_id
ORDER BY min_qty ASC;
"""

update = """
UPDATE product_variant_prices
SET
    variant_id = :variant_id,
    discount_id = :discount_id,
    min_qty = :min_qty,
    price = :price,
    is_active = COALESCE(:is_active, is_active),
    updated_at = :updated_at
WHERE id = :id;
"""

soft_delete = """
UPDATE product_variant_prices
SET is_deleted = TRUE, updated_at = NOW()
WHERE id = :id;
"""

activate = """
UPDATE product_variant_prices
SET is_active = TRUE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

deactivate = """
UPDATE product_variant_prices
SET is_active = FALSE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

check_existing = """
SELECT id
FROM product_variant_prices
WHERE variant_id = :variant_id
AND min_qty = :min_qty
AND is_deleted = FALSE
LIMIT 1;
"""

get_price_by_quantity = """
SELECT *
FROM product_variant_prices
WHERE variant_id = :variant_id
AND is_active = TRUE
AND is_deleted = FALSE
ORDER BY 
    CASE 
        WHEN min_qty <= :quantity THEN 0 
        ELSE 1 
    END,
    min_qty DESC
LIMIT 1;
"""