[user_role]

create = """
INSERT INTO user_roles (id, user_id, role_id, assigned_by, assigned_at, created_at, updated_at)
VALUES (:id, :user_id, :role_id, :assigned_by, :assigned_at, :created_at, :updated_at)
ON DUPLICATE KEY UPDATE
    assigned_by = VALUES(assigned_by),
    assigned_at = VALUES(assigned_at),
    updated_at = NOW();
"""

get_all = """
SELECT *
FROM user_roles
ORDER BY assigned_at DESC;
"""

get_by_id = """
SELECT *
FROM user_roles
WHERE id = :id;
"""

get_by_user_id = """
SELECT r.name AS name
FROM user_roles ur
JOIN roles r ON ur.role_id = r.id
WHERE ur.user_id = :user_id
ORDER BY ur.assigned_at DESC;
"""

update = """
UPDATE user_roles
SET {set_clause},
    updated_at = NOW()
WHERE id = :id;
"""

delete = """
DELETE FROM user_roles
WHERE id = :id;
"""