[user_role]

assign_role = """
INSERT INTO user_role (user_id, role_id, assigned_by)
VALUES ($1, $2, $3)
RETURNING user_id, role_id, assigned_by, assigned_at;
"""

get_roles_by_user = """
SELECT r.id, r.name
FROM user_role ur
JOIN role r ON r.id = ur.role_id
WHERE ur.user_id = $1;
"""

remove_role = """
DELETE FROM user_role
WHERE user_id = $1 AND role_id = $2
RETURNING user_id;
"""

get_all_user_roles = """
SELECT ur.user_id, r.name AS role
FROM user_role ur
JOIN role r ON r.id = ur.role_id;
"""

get_all_users_with_roles = """
SELECT
    u.id,
    u.full_name,
    u.email,
    r.id as role_id,
    r.name as role_name,
    ur.assigned_by,
    assigner.full_name as assigned_by_name,
    ur.assigned_at
FROM "User" u
JOIN user_role ur ON u.id = ur.user_id
JOIN role r ON ur.role_id = r.id
LEFT JOIN "User" assigner ON ur.assigned_by = assigner.id
ORDER BY u.id;
"""