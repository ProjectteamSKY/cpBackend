[product_discount]

create = """
INSERT INTO product_discounts (
    id, product_id, title, description, discount, banner_image_url, cta_text,
    start_date, end_date, is_active, created_at, updated_at
) VALUES (
    :id, :product_id, :title, :description, :discount, :banner_image_url, :cta_text,
    :start_date, :end_date, :is_active, :created_at, :updated_at
);
"""

get_all = """
SELECT pd.*, p.name AS product_name
FROM product_discounts pd
LEFT JOIN products p ON pd.product_id = p.id
WHERE pd.is_deleted = FALSE
ORDER BY pd.created_at DESC;
"""

get_all_active = """
SELECT pd.*, p.name AS product_name
FROM product_discounts pd
LEFT JOIN products p ON pd.product_id = p.id
WHERE pd.is_deleted = FALSE
AND pd.is_active = TRUE
ORDER BY pd.created_at DESC;
"""

get_by_id = """
SELECT * FROM product_discounts
WHERE id = :id;
"""

get_by_product = """
SELECT pd.*, p.name AS product_name
FROM product_discounts pd
LEFT JOIN products p ON pd.product_id = p.id
WHERE pd.product_id = :product_id
ORDER BY pd.created_at DESC;
"""

update = """
UPDATE product_discounts
SET
    product_id = :product_id,
    title = :title,
    description = :description,
    discount = :discount,
    banner_image_url = :banner_image_url,
    cta_text = :cta_text,
    start_date = :start_date,
    end_date = :end_date,
    updated_at = :updated_at
WHERE id = :id;
"""

soft_delete = """
UPDATE product_discounts
SET is_deleted = TRUE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

activate = """
UPDATE product_discounts
SET is_active = TRUE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

deactivate = """
UPDATE product_discounts
SET is_active = FALSE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

get_by_date_range = """
SELECT pd.*, p.name AS product_name
FROM product_discounts pd
LEFT JOIN products p ON pd.product_id = p.id
WHERE pd.is_active = TRUE
AND pd.start_date >= :start_date
AND pd.end_date <= :end_date
ORDER BY pd.start_date DESC;
"""

get_last5_active_discounts = """
SELECT *
FROM product_discounts
WHERE is_deleted = FALSE
  AND is_active = TRUE
  AND banner_image_url IS NOT NULL
  AND title IS NOT NULL
  AND description IS NOT NULL
  AND cta_text IS NOT NULL
ORDER BY created_at DESC
LIMIT 5;
"""