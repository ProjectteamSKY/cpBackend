[product]

create = """
INSERT INTO products (
    id, category_id, subcategory_id, name, sku, description,
    min_order_qty, max_order_qty, images, related_images,
    is_active, is_deleted, created_at, updated_at
)
VALUES (
    :id, :category_id, :subcategory_id, :name, :sku, :description,
    :min_order_qty, :max_order_qty, :images, :related_images,
    :is_active, FALSE, :created_at, :updated_at
)
ON DUPLICATE KEY UPDATE
    is_deleted = FALSE,
    is_active = TRUE,
    sku = VALUES(sku),
    description = VALUES(description),
    category_id = VALUES(category_id),
    subcategory_id = VALUES(subcategory_id),
    min_order_qty = VALUES(min_order_qty),
    max_order_qty = VALUES(max_order_qty),
    images = VALUES(images),
    related_images = VALUES(related_images),
    updated_at = NOW();
"""

get_all = """
SELECT 
    p.id,
    p.name,
    p.sku,
    p.description,
    p.min_order_qty,
    p.max_order_qty,
    p.category_id,
    c.name AS category_name,
    p.subcategory_id,
    s.name AS subcategory_name,
    p.images,
    p.related_images,
    p.is_active,
    p.created_at
FROM products p
LEFT JOIN categories c ON p.category_id = c.id
LEFT JOIN subcategories s ON p.subcategory_id = s.id
WHERE p.is_deleted = FALSE
ORDER BY p.created_at DESC;
"""

get_all_active = """
SELECT 
    p.id,
    p.name,
    p.sku,
    p.description,
    p.min_order_qty,
    p.max_order_qty,
    p.category_id,
    c.name AS category_name,
    p.subcategory_id,
    s.name AS subcategory_name,
    p.images,
    p.related_images,
    p.is_active,
    p.created_at
FROM products p
LEFT JOIN categories c ON p.category_id = c.id
LEFT JOIN subcategories s ON p.subcategory_id = s.id
WHERE p.is_deleted = FALSE
AND p.is_active = TRUE
ORDER BY p.created_at DESC;
"""

get_by_id = """
SELECT * FROM products
WHERE id = :id;
"""

get_by_category = """
SELECT 
    p.id AS product_id,
    p.name AS product_name,
    p.description,
    p.category_id,
    p.created_at,

    p.images,
    p.related_images,

    v.id AS variant_id,
    v.size_id,
    v.paper_type_id,
    v.print_type_id,
    v.cut_type_id,
    v.sides,
    v.orientation,

    vp.id AS variant_price_id,
    vp.price,
    vp.min_qty

FROM products p

LEFT JOIN product_variants v 
    ON v.product_id = p.id

LEFT JOIN product_variant_prices vp 
    ON vp.variant_id = v.id

WHERE 
    p.category_id = :category_id 
    AND p.is_active = TRUE

ORDER BY p.created_at DESC;
"""

# ✅ FIXED UPDATE - All parameters with COALESCE fallback
update = """
UPDATE products
SET
    category_id = COALESCE(:category_id, category_id),
    subcategory_id = COALESCE(:subcategory_id, subcategory_id),
    name = COALESCE(:name, name),
    sku = COALESCE(:sku, sku),
    description = COALESCE(:description, description),
    min_order_qty = COALESCE(:min_order_qty, min_order_qty),
    max_order_qty = COALESCE(:max_order_qty, max_order_qty),
    images = COALESCE(:images, images),
    related_images = COALESCE(:related_images, related_images),
    updated_at = :updated_at
WHERE id = :id;
"""

delete = """
UPDATE products
SET is_deleted = TRUE,
    is_active = FALSE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

activate = """
UPDATE products
SET is_active = TRUE, updated_at = NOW()
WHERE id = :id;
"""

deactivate = """
UPDATE products
SET is_active = FALSE, updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

