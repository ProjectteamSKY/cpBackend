[resource]

create = """
INSERT INTO resources (id, name, description, is_active, is_deleted, created_at, updated_at)
VALUES (:id, :name, :description, :is_active, FALSE, :created_at, :updated_at)
ON DUPLICATE KEY UPDATE
    is_deleted = FALSE,
    description = VALUES(description),
    is_active = VALUES(is_active),
    updated_at = NOW();
"""

get_all = """
SELECT *
FROM resources
WHERE is_deleted = FALSE
ORDER BY created_at DESC;
"""

get_by_id = """
SELECT *
FROM resources
WHERE id = :id
AND is_deleted = FALSE;
"""

update = """
UPDATE resources
SET {set_clause},
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

delete = """
UPDATE resources
SET is_deleted = TRUE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

activate = """
UPDATE resources
SET is_active = TRUE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

deactivate = """
UPDATE resources
SET is_active = FALSE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""

restore = """
UPDATE resources
SET is_deleted = FALSE,
    updated_at = NOW()
WHERE id = :id;
"""

get_all_with_deleted = """
SELECT *
FROM resources
ORDER BY created_at DESC;
"""