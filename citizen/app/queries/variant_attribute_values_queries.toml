[variant_attribute_values]

create = """
INSERT INTO variant_attribute_values (
    id, variant_id, attribute_id, attribute_value_id,
    is_active, is_deleted,
    created_at, updated_at
)
VALUES (
    :id, :variant_id, :attribute_id, :attribute_value_id,
    :is_active, FALSE,
    :created_at, :updated_at
)
ON DUPLICATE KEY UPDATE
    is_deleted = FALSE,
    is_active = VALUES(is_active),
    updated_at = NOW();
"""

get_by_variant = """
SELECT 
    vav.id,
    vav.variant_id,
    vav.attribute_id,
    vav.attribute_value_id,
    a.name AS attribute_name,
    av.value AS attribute_value_name,
    vav.is_active,
    vav.created_at,
    vav.updated_at
FROM variant_attribute_values vav
JOIN attributes a ON vav.attribute_id = a.id
JOIN attribute_values av ON vav.attribute_value_id = av.id
WHERE vav.variant_id = :variant_id
AND vav.is_deleted = FALSE;
"""

get_by_id = """
SELECT 
    vav.id,
    vav.variant_id,
    vav.attribute_id,
    vav.attribute_value_id,
    COALESCE(a.name, '') AS attribute_name,
    COALESCE(av.value, '') AS attribute_value_name,
    vav.is_active,
    vav.created_at,
    vav.updated_at
FROM variant_attribute_values vav
LEFT JOIN attributes a ON vav.attribute_id = a.id
LEFT JOIN attribute_values av ON vav.attribute_value_id = av.id
WHERE vav.id = :id
AND vav.is_deleted = FALSE;
"""

delete = """
UPDATE variant_attribute_values
SET is_deleted = TRUE,
    updated_at = NOW()
WHERE id = :id
AND is_deleted = FALSE;
"""