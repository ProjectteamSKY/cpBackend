[cart_items]

create = """
INSERT INTO cart_items (
    id,
    cart_id,
    product_id,
    variant_id,
    variant_price_id,
    quantity,
    unit_price,
    total_price,
    selected_attributes,
    discount_id,
    created_at,
    updated_at
) VALUES (
    :id,
    :cart_id,
    :product_id,
    :variant_id,
    :variant_price_id,
    :quantity,
    :unit_price,
    :total_price,
    :selected_attributes,
    :discount_id,
    :created_at,
    :updated_at
);
"""


get_by_id = """
SELECT * FROM cart_items
WHERE id = :id;
"""

get_by_cart_id = """
SELECT *
FROM cart_items
WHERE cart_id = :cart_id
ORDER BY created_at DESC;
"""

get_by_user_id = """
SELECT ci.*
FROM cart_items ci
JOIN carts c ON ci.cart_id = c.id
WHERE c.user_id = :user_id
AND ci.status = 'active'
ORDER BY ci.created_at DESC;
"""

delete = """
DELETE FROM cart_items
WHERE id = :id;
"""

# ------------------------------------------------

variant_price_lookup = """
SELECT *
FROM variant_prices
WHERE variant_id = :variant_id
AND is_active = 1
AND is_deleted = 0
AND :quantity >= min_qty
AND (max_qty IS NULL OR :quantity <= max_qty)
ORDER BY min_qty DESC
LIMIT 1
"""

# ------------------------------------------------

cart_total = """
SELECT COALESCE(SUM(total_price),0) AS total
FROM cart_items
WHERE cart_id = :cart_id
"""


# ------------------------------------------------

find_existing_item = """
SELECT *
FROM cart_items
WHERE cart_id = :cart_id
AND variant_id = :variant_id
LIMIT 1
"""

merge_update = """
UPDATE cart_items
SET quantity = :quantity,
unit_price = :unit_price,
total_price = :total_price,
discount_id = :discount_id,
updated_at = NOW()
WHERE id = :id
"""

# ------------------------------------------------

insert_cart_files = """
INSERT INTO cart_item_files (
    id,
    cart_item_id,
    front_side_url,
    back_side_url,
    front_original_name,
    back_original_name,
    created_at
) VALUES (
    :id,
    :cart_item_id,
    :front_side_url,
    :back_side_url,
    :front_original_name,
    :back_original_name,
    NOW()
)
"""

get_files_by_cart_item_id = """
SELECT *
FROM cart_item_files
WHERE cart_item_id = :cart_item_id
"""


lock_items = """
SELECT *
FROM cart_items
WHERE cart_id = :cart_id
AND id IN :cart_item_ids
FOR UPDATE;
"""

get_files = """
SELECT *
FROM cart_item_files
WHERE cart_item_id = :cart_item_id;
"""

mark_purchased = """
UPDATE cart_items
SET status = 'purchased',
    updated_at = :updated_at
WHERE id IN :cart_item_ids;
"""

get_cart_total = """
SELECT COALESCE(SUM(total_price), 0) AS total
FROM cart_items
WHERE cart_id = :cart_id
AND status = 'active';
"""

update_cart_total = """
UPDATE carts
SET total_amount = :total,
    updated_at = :updated_at
WHERE id = :cart_id;
"""